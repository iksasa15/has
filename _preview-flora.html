<!doctype html>
<meta charset="utf-8">
<style>
body{margin:0;display:grid;grid-template-columns:1fr 1fr;height:100vh;font-family:sans-serif}
.box{position:relative;overflow:hidden}
.cream{background:#EDE7D4}
.purp{background:#7473B3}
img{position:absolute;bottom:-40px;height:70%;width:auto}
.l{left:-40px}
.r{right:-50px;transform:scaleX(-1)}
</style>
<div class="box cream">
  <img class="l" src="_assets/lavender.svg">
  <img class="r" src="_assets/lavender.svg">
</div>
<div class="box purp">
  <img class="l" src="_assets/lavender-on-purple.svg">
  <img class="r" src="_assets/lavender-on-purple.svg">
</div>
